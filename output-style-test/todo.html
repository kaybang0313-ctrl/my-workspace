<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 목록</title>
  <!-- Tailwind CSS를 CDN(인터넷 주소)으로 불러옵니다 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<!-- 배경은 연한 회색, 카드를 화면 가운데에 배치 -->
<body class="bg-slate-100 min-h-screen flex items-start justify-center p-6">

  <!-- 카드 영역: 흰 배경 + 둥근 모서리 + 그림자 -->
  <main class="bg-white w-full max-w-md mt-10 rounded-2xl shadow-lg p-6">
    <h1 class="text-2xl font-bold text-slate-800 mb-4">📝 할 일 목록</h1>

    <!-- 입력 영역: 입력창 + 추가 버튼 -->
    <form id="todo-form" class="flex gap-2 mb-4">
      <input
        id="todo-input"
        type="text"
        placeholder="할 일을 입력하세요"
        class="flex-1 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"
      />
      <button
        type="submit"
        class="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold px-4 py-2 rounded-lg"
      >
        추가
      </button>
    </form>

    <!-- 할 일 목록이 들어갈 자리 (JavaScript가 채워줍니다) -->
    <ul id="todo-list" class="space-y-2"></ul>

    <!-- 할 일이 하나도 없을 때 보여줄 안내 문구 -->
    <p id="empty-msg" class="text-center text-slate-400 py-4">할 일이 없어요. 하나 추가해 보세요!</p>
  </main>

  <script>
    // ===== 1. 필요한 HTML 요소 가져오기 =====
    const form = document.getElementById('todo-form');      // 입력 폼
    const input = document.getElementById('todo-input');    // 텍스트 입력창
    const list = document.getElementById('todo-list');      // 목록(ul)
    const emptyMsg = document.getElementById('empty-msg');  // 빈 목록 안내 문구

    // ===== 2. 할 일 데이터 저장소 =====
    // 각 할 일은 { id: 고유번호, text: 내용, done: 완료 여부 } 모양의 객체입니다.
    let todos = [];

    // ===== 3. 화면 그리기 함수 =====
    // todos 배열의 내용을 보고 화면의 목록을 처음부터 다시 만듭니다.
    function render() {
      list.innerHTML = ''; // 기존 목록을 싹 비웁니다

      // 할 일이 없으면 안내 문구를 보여주고, 있으면 숨깁니다
      emptyMsg.classList.toggle('hidden', todos.length > 0);

      // 할 일 하나하나를 <li> 줄로 만들어 목록에 붙입니다
      todos.forEach(function (todo) {
        const li = document.createElement('li');
        li.className = 'flex items-center gap-3 bg-slate-50 rounded-lg px-3 py-2';

        // 체크박스: 완료 여부를 표시하고, 바꾸면 toggleTodo 실행
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.className = 'w-5 h-5 accent-indigo-500 cursor-pointer';
        checkbox.addEventListener('change', function () {
          toggleTodo(todo.id);
        });

        // 할 일 글자: 완료(done)이면 줄을 긋고(line-through) 색을 흐리게
        const span = document.createElement('span');
        span.textContent = todo.text; // textContent는 입력값을 안전하게 글자로만 넣어줍니다
        span.className = 'flex-1 break-all ' +
          (todo.done ? 'line-through text-slate-400' : 'text-slate-700');

        // 삭제 버튼: 누르면 deleteTodo 실행
        const delBtn = document.createElement('button');
        delBtn.textContent = '삭제';
        delBtn.className = 'text-sm text-red-500 hover:text-red-700 font-medium';
        delBtn.addEventListener('click', function () {
          deleteTodo(todo.id);
        });

        // 만든 부품 3개를 <li>에 차례로 넣고, <li>를 목록에 붙입니다
        li.append(checkbox, span, delBtn);
        list.appendChild(li);
      });
    }

    // ===== 4. 할 일 추가 함수 =====
    function addTodo(text) {
      todos.push({
        id: Date.now(), // 현재 시각(숫자)을 고유번호로 사용합니다
        text: text,
        done: false     // 처음에는 완료되지 않은 상태
      });
      render(); // 바뀐 내용을 화면에 반영
    }

    // ===== 5. 완료 상태 바꾸기 함수 =====
    // 번호(id)가 같은 할 일의 done 값을 true <-> false 로 뒤집습니다.
    function toggleTodo(id) {
      todos = todos.map(function (todo) {
        return todo.id === id ? { ...todo, done: !todo.done } : todo;
      });
      render();
    }

    // ===== 6. 할 일 삭제 함수 =====
    // 번호(id)가 다른 것들만 남기면 해당 할 일이 사라집니다.
    function deleteTodo(id) {
      todos = todos.filter(function (todo) {
        return todo.id !== id;
      });
      render();
    }

    // ===== 7. 폼 제출 이벤트 =====
    // 추가 버튼 클릭 또는 Enter 키를 누르면 실행됩니다.
    form.addEventListener('submit', function (event) {
      event.preventDefault();          // 페이지가 새로고침되는 기본 동작 막기
      const text = input.value.trim(); // 앞뒤 공백 제거
      if (text === '') return;         // 빈 입력이면 아무것도 하지 않음
      addTodo(text);
      input.value = '';                // 입력창 비우기
      input.focus();                   // 바로 다음 할 일을 입력할 수 있게 커서 유지
    });

    // 처음 열었을 때 화면 한 번 그리기
    render();
  </script>
</body>
</html>
