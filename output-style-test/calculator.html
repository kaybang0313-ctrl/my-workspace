<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계산기</title>
<style>
  body { font-family: sans-serif; background: #f3f4f6; display: flex; justify-content: center; padding: 40px 16px; margin: 0; }
  .calc { background: #fff; width: 100%; max-width: 320px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  #display { background: #111827; color: #fff; text-align: right; font-size: 32px; padding: 16px; border-radius: 8px; margin-bottom: 16px; min-height: 40px; overflow-x: auto; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button { padding: 16px 0; font-size: 20px; border: 0; border-radius: 8px; background: #e5e7eb; cursor: pointer; }
  button:active { background: #d1d5db; }
  button.op { background: #4f46e5; color: #fff; }
  button.fn { background: #fca5a5; }
  button.eq { grid-column: span 2; background: #10b981; color: #fff; }
</style>
</head>
<body>
<div class="calc">
  <div id="display">0</div>
  <div class="keys">
    <button class="fn" data-action="clear">C</button>
    <button class="fn" data-action="back">⌫</button>
    <button class="op" data-op="%">%</button>
    <button class="op" data-op="/">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="*">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="-">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button data-num="0">0</button>
    <button data-num=".">.</button>
    <button class="eq" data-action="equals">=</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');

  let current = '0';   // 지금 입력 중인 숫자 (문자열)
  let previous = null; // 연산자를 누르기 전에 입력한 숫자
  let operator = null; // 선택된 연산자
  let justEvaluated = false;

  // 두 숫자와 연산자를 받아 결과를 반환한다.
  // 오류 상황(예: 0으로 나누기)이면 문자열 '오류'를 반환한다.
  function calculate(a, b, op) {
    // TODO(human): +, -, *, /, % 연산을 구현하세요.
    return b;
  }

  function update() {
    display.textContent = current;
  }

  function inputNumber(n) {
    if (justEvaluated) { current = '0'; justEvaluated = false; }
    if (current === '오류') current = '0';
    if (n === '.' && current.includes('.')) return;
    current = (current === '0' && n !== '.') ? n : current + n;
  }

  function inputOperator(op) {
    if (current === '오류') return;
    if (operator && !justEvaluated) equals();
    previous = parseFloat(current);
    operator = op;
    justEvaluated = true;
  }

  function equals() {
    if (operator === null || previous === null) return;
    const result = calculate(previous, parseFloat(current), operator);
    current = String(result);
    previous = null;
    operator = null;
    justEvaluated = true;
  }

  function clearAll() {
    current = '0'; previous = null; operator = null; justEvaluated = false;
  }

  function backspace() {
    if (justEvaluated || current === '오류') return;
    current = current.length > 1 ? current.slice(0, -1) : '0';
  }

  document.querySelector('.keys').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.num !== undefined) inputNumber(b.dataset.num);
    else if (b.dataset.op) inputOperator(b.dataset.op);
    else if (b.dataset.action === 'equals') equals();
    else if (b.dataset.action === 'clear') clearAll();
    else if (b.dataset.action === 'back') backspace();
    update();
  });
</script>
</body>
</html>
